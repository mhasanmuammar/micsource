id: io.github.mhasanmuammar.MicSource
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: micsource-gui

finish-args:
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --device=usb
  - --require-version=1.16.0
  - --filesystem=xdg-data/gnome-shell/extensions
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.gnome.Shell.Extensions

modules:
  - name: adb
    buildsystem: simple
    build-commands:
      - unzip -o platform-tools_r37.0.1-linux.zip -d platform-tools && install -Dm755 platform-tools/platform-tools/adb /app/bin/adb
    sources:
      - type: file
        url: https://dl.google.com/android/repository/platform-tools_r37.0.1-linux.zip
        sha256: d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1
  - name: micsource
    buildsystem: simple
    build-commands:
      - install -Dm755 micsource-gui /app/bin/micsource-gui
      - install -Dm755 micsource /app/bin/micsource
      - install -Dm644 micsource-app.py /app/lib/micsource/micsource-app.py
      - install -Dm644 micsource-tray.py /app/lib/micsource/micsource-tray.py
      - install -Dm644 micsource-monitor.py /app/lib/micsource/micsource-monitor.py
      - install -Dm644 micsource_adb.py /app/lib/micsource/micsource_adb.py
      - install -Dm644 paths.py /app/lib/micsource/paths.py
      - mkdir -p /app/lib/micsource
      - mkdir -p /app/share/micsource/gnome
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - install -Dm644 gnome/* /app/share/micsource/gnome/
      - install -Dm644 io.github.mhasanmuammar.MicSource.desktop /app/share/applications/io.github.mhasanmuammar.MicSource.desktop
      - install -Dm644 io.github.mhasanmuammar.MicSource.service /app/share/dbus-1/services/io.github.mhasanmuammar.MicSource.service
      - install -Dm644 io.github.mhasanmuammar.MicSource.metainfo.xml /app/share/metainfo/io.github.mhasanmuammar.MicSource.metainfo.xml
      - install -Dm644 io.github.mhasanmuammar.MicSource.svg /app/share/icons/hicolor/scalable/apps/io.github.mhasanmuammar.MicSource.svg
    sources:
      - type: dir
        path: .