name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: micsource-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  flatpak-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Flatpak manifest YAML
        run: |
          pip install pyyaml
          python3 -c "import yaml; yaml.safe_load(open('flatpak/io.github.mhasanmuammar.MicSource.yml'))"

      - name: Validate AppStream metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate flatpak/io.github.mhasanmuammar.MicSource.metainfo.xml

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime
        run: |
          flatpak install -y --user flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak
        run: flatpak-builder --repo=repo --user --install --force-clean builddir flatpak/io.github.mhasanmuammar.MicSource.yml

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Flatpak bundle
        run: |
          flatpak build-bundle repo "dist/micsource-flatpak.flatpak" io.github.mhasanmuammar.MicSource

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: micsource-flatpak
          path: dist/micsource-flatpak.flatpak

      - name: Verify Flatpak app ID
        run: flatpak run io.github.mhasanmuammar.MicSource --version 2>/dev/null || true
