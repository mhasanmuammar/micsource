name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime
        run: |
          flatpak install -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak
        run: flatpak-builder --user --install --force-clean builddir flatpak/io.github.mhasanmuammar.MicSource.yml

      - name: Verify Flatpak app ID
        run: flatpak run io.github.mhasanmuammar.MicSource --version 2>/dev/null || true

  flatpak-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flatpak-builder-lint
        run: |
          pip install flatpak-builder-lint

      - name: Lint Flatpak manifest
        run: flatpak-builder-lint flatpak/io.github.mhasanmuammar.MicSource.yml 2>&1 || true
