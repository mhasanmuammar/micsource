name: Release APK

# Tag a commit with v<version> (for example v1.6) to publish a signed APK
# on GitHub Releases. The desktop app no longer builds or installs the APK;
# it links users to the latest release instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Optional release signing. Configure these repository secrets to keep
      # the same signer across releases (required for in-place app updates):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the APK is debug-signed, which is fine for sideloading
      # but cannot update an APK signed by a different key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; building a debug-signed APK."
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Build release APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${version}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/micsource-${version}.apk"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Verify APK signature
        run: |
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" \
            -name apksigner -type f | sort | tail -n 1)"
          "${apksigner}" verify --print-certs "dist/micsource-${VERSION}.apk"

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --repo=repo --force-clean builddir flatpak/io.github.mhasanmuammar.MicSource.yml
          flatpak build-bundle repo "dist/micsource-${VERSION}.flatpak" io.github.mhasanmuammar.MicSource
          echo "FLATPAK_BUILT=1" >> "${GITHUB_ENV}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="v${VERSION}"
          fi
          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --title "MicSource ${VERSION}" \
              --generate-notes
          gh release upload "${tag}" "dist/micsource-${VERSION}.apk" --clobber
          if [ -f "dist/micsource-${VERSION}.flatpak" ]; then
            gh release upload "${tag}" "dist/micsource-${VERSION}.flatpak" --clobber